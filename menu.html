<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Aam - Food Menu</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .customer-menu {
            max-width: 1100px;
            margin: auto;
            padding: 35px 20px;
        }

        .menu-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .menu-top h1 {
            margin: 8px 0;
        }

        .menu-top a {
            color: #315c43;
            text-decoration: none;
            font-weight: bold;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .food-card {
            background: white;
            border: 1px solid #e7e7e7;
            border-radius: 14px;
            overflow: hidden;
        }

        .food-photo {
            height: 150px;
            background: #f1f3eb;
            display: grid;
            place-items: center;
            font-size: 65px;
        }

        .food-details {
            padding: 17px;
        }

        .food-details p {
            color: #777;
            font-size: 13px;
        }

        .food-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .food-action strong {
            color: #315c43;
        }

        .food-action button,
        .confirm-btn {
            background: #315c43;
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
        }

        .cart-box {
            background: white;
            border: 1px solid #e7e7e7;
            border-radius: 14px;
            padding: 22px;
            margin-top: 35px;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-row button {
            margin-left: 8px;
            cursor: pointer;
        }

        .customer-menu input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 10px 0 15px;
            box-sizing: border-box;
        }

        .confirm-btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
        }

        .category-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .category-buttons button {
            padding: 9px 15px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
        }

        .category-buttons button.active {
            background: #315c43;
            color: white;
        }

        /* Customer Order Tracking */

        .order-tracking {
            background: white;
            border: 1px solid #e7e7e7;
            border-radius: 14px;
            padding: 22px;
            margin-top: 25px;
        }

        .tracking-order {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
        }

        .tracking-status {
            color: #315c43;
            font-weight: bold;
            margin-top: 8px;
        }

        .tracking-progress {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            font-size: 13px;
            flex-wrap: wrap;
        }

        .tracking-step {
            background: #eee;
            color: #777;
            padding: 7px 10px;
            border-radius: 20px;
        }

        .tracking-step.active {
            background: #315c43;
            color: white;
        }
    </style>
</head>

<body>

<div class="customer-menu">

    <div class="menu-top">
        <div>
            <p>TABLE & THYME</p>
            <h1>Our Food Menu 🍽️</h1>
            <p>Choose your favorite food.</p>
        </div>

        <a href="doc.html">Staff Dashboard →</a>
    </div>

    <label for="tableNumber">Your Table Number</label>
    <input
        id="tableNumber"
        type="number"
        min="1"
        max="999"
        placeholder="Enter table number"
    >

    <h2>Food Categories</h2>
    <div class="category-buttons" id="categories"></div>

    <h2>Food Menu</h2>
    <div class="food-grid" id="foodGrid"></div>

    <section class="cart-box">
        <h2>🛒 Your Order</h2>

        <div id="cartItems">
            Your cart is empty.
        </div>

        <h3 id="cartTotal">Total: ฿0.00</h3>

        <button class="confirm-btn" id="confirmBtn">
            Confirm Order
        </button>
    </section>

    <!-- Customer Order Tracking -->
    <section class="order-tracking">
        <h2>📦 Your Order Status</h2>

        <p id="trackingMessage">
            Your orders will appear here after ordering.
        </p>

        <div id="customerOrders"></div>
    </section>

</div>

</html>
