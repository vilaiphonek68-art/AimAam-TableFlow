<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Aam - Food Menu</title>
    <link rel="stylesheet" href="style.css">

    <style>
      /* ===== TABLEFLOW - DRIBBBLE FOOD THEME ===== */

.customer-menu {
    width: min(100% - 40px, 1050px);
    margin: 35px auto;
    padding: 30px;
    box-sizing: border-box;
    background: #F7F5EA;
    border-radius: 28px;
    color: #20251F;
    font-family: Arial, sans-serif;
}

/* Header */
.customer-menu .menu-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 35px;
}

.customer-menu .menu-top p {
    color: #647168;
    margin: 5px 0;
}

.customer-menu .menu-top h1 {
    color: #153D32;
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 900;
    margin: 8px 0;
    letter-spacing: -1.5px;
}

.customer-menu .menu-top a {
    color: #153D32;
    text-decoration: none;
    font-weight: bold;
    background: #B7F34A;
    padding: 12px 18px;
    border-radius: 30px;
    white-space: nowrap;
    transition: 0.2s;
}

.customer-menu .menu-top a:hover {
    background: #E7F56A;
    transform: translateY(-3px);
}

/* Section headings */
.customer-menu h2 {
    color: #153D32;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 28px 0 15px;
}

.customer-menu label {
    display: block;
    font-weight: bold;
    color: #153D32;
    margin-bottom: 8px;
}

/* Table input */
.customer-menu input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #dce2d3;
    border-radius: 13px;
    margin: 8px 0 20px;
    box-sizing: border-box;
    background: white;
    font-size: 15px;
    outline: none;
}

.customer-menu input:focus {
    border-color: #153D32;
    box-shadow: 0 0 0 3px rgba(183, 243, 74, 0.35);
}

/* Categories */
.customer-menu .category-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 18px 0 28px;
}

.customer-menu .category-buttons button {
    padding: 10px 19px;
    border: 1px solid #dce2d3;
    background: white;
    color: #153D32;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.customer-menu .category-buttons button:hover {
    background: #E7F56A;
    border-color: #E7F56A;
}

.customer-menu .category-buttons button.active {
    background: #153D32;
    color: white;
    border-color: #153D32;
}

/* Food cards */
.customer-menu .food-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    margin-top: 20px;
}

.customer-menu .food-card {
    background: white;
    border: 1px solid #e9ecdf;
    border-radius: 20px;
    overflow: hidden;
    transition: transform 0.25s, box-shadow 0.25s;
}

.customer-menu .food-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 14px 30px rgba(21, 61, 50, 0.12);
}

.customer-menu .food-photo {
    height: 175px;
    background: #E7F56A;
    display: grid;
    place-items: center;
    font-size: 65px;
    overflow: hidden;
}

.customer-menu .food-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.customer-menu .food-details {
    padding: 17px;
}

.customer-menu .food-details h3 {
    color: #153D32;
    font-size: 17px;
    margin: 0 0 8px;
}

.customer-menu .food-details p {
    color: #7b8278;
    font-size: 13px;
    line-height: 1.5;
}

.customer-menu .food-action {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
}

.customer-menu .food-action strong {
    color: #153D32;
    font-size: 17px;
}

.customer-menu .food-action button,
.customer-menu .confirm-btn {
    background: #153D32;
    color: white;
    border: 0;
    border-radius: 12px;
    padding: 11px 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.customer-menu .food-action button:hover,
.customer-menu .confirm-btn:hover {
    background: #315C43;
    transform: translateY(-2px);
}

/* Cart */
.customer-menu .cart-box,
.customer-menu .order-tracking {
    background: white;
    border: 1px solid #e9ecdf;
    border-radius: 22px;
    padding: 24px;
    margin-top: 30px;
}

.customer-menu .cart-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid #edf0e8;
}

.customer-menu .cart-row button {
    border: 0;
    border-radius: 8px;
    padding: 7px 11px;
    background: #E7F56A;
    color: #153D32;
    cursor: pointer;
}

.customer-menu #cartTotal {
    color: #153D32;
    margin-top: 20px;
}

.customer-menu .confirm-btn {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    background: #B7F34A;
    color: #153D32;
    font-size: 16px;
}

.customer-menu .confirm-btn:hover {
    background: #E7F56A;
}

/* Order tracking */
.customer-menu .tracking-order {
    border: 1px solid #e9ecdf;
    border-radius: 15px;
    padding: 16px;
    margin-top: 14px;
    background: #F7F5EA;
}

.customer-menu .tracking-status {
    color: #153D32;
    font-weight: bold;
    margin-top: 8px;
}

.customer-menu .tracking-progress {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    font-size: 13px;
    flex-wrap: wrap;
}

.customer-menu .tracking-step {
    background: #e8eadf;
    color: #687267;
    padding: 8px 12px;
    border-radius: 20px;
}

.customer-menu .tracking-step.active {
    background: #B7F34A;
    color: #153D32;
    font-weight: bold;
}

/* Responsive */
@media (max-width: 760px) {
    .customer-menu {
        width: 100%;
        margin: 0 auto;
        padding: 22px 16px;
        border-radius: 0;
    }

    .customer-menu .food-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .customer-menu .food-photo {
        height: 135px;
    }

    .customer-menu .food-details {
        padding: 12px;
    }

    .customer-menu .menu-top {
        align-items: flex-start;
    }
}

@media (max-width: 420px) {
    .customer-menu .food-grid {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>

<body>

<div class="customer-menu">

    <div class="menu-top">
        <div>
            <p>Aim Aam</p>
            <h1>Our Food Menu 🍽️</h1>
            <p>AimAam online service.</p>
        </div>

        <a href="doc.html">Staff Dashboard →</a>
    </div>

    <label for="tableNumber">Table Number</label>
    <input
        id="tableNumber"
        type="number"
        min="1"
        max="999"
        placeholder="Enter table number"
    >

    <h2>what you want</h2>
    <div class="category-buttons" id="categories"></div>

    <h2>Food Menu</h2>
    <div class="food-grid" id="foodGrid"></div>

    <section class="cart-box">
        <h2>🛒 Your Order</h2>

        <div id="cartItems">
            Your cart is empty.
        </div>

        <h3 id="cartTotal">Total: ฿0.00</h3>

        <button class="confirm-btn" id="confirmBtn">
            Confirm Order
        </button>
    </section>

    <section class="order-tracking">
        <h2>📦 Your Order Status</h2>

        <p id="trackingMessage">
            Your orders will appear here after ordering.
        </p>

        <div id="customerOrders"></div>
    </section>

</div>
